[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stationapp"
version = "0.1.0"
description = "BLE module programming and traceability station application"
requires-python = ">=3.11,<3.12"
readme = "README.md"

# Runtime dependencies. Mirror requirements.txt, but here as the
# authoritative list that travels with the package.
dependencies = [
    "PyQt6>=6.6,<7.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyserial>=3.5,<4.0",
    "httpx>=0.27,<1.0",
    "argon2-cffi>=23.1,<25.0",
    "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
    "pyinstaller>=6.3,<7.0",
]

# Lets a station run the app as `stationapp` from a terminal,
# rather than always `python -m stationapp`.
[project.scripts]
stationapp = "stationapp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# --- Tooling configuration -------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure domain logic, no I/O",
    "integration: touches filesystem, database, or hardware",
    "hardware: requires a connected jig — skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter
